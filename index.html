<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D शूटर फिक्स गेम</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #111; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .game-container { position: relative; width: 320px; height: 350px; }
        canvas { background-color: #222; border: 3px solid #ff4757; border-radius: 8px; box-shadow: 0 0 15px rgba(255, 71, 87, 0.4); }
        .info { font-size: 20px; margin: 10px; font-weight: bold; }
        .controls { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; margin-top: 15px; }
        .btn { background-color: #ff4757; color: white; border: none; font-size: 24px; font-weight: bold; border-radius: 10px; padding: 15px 0; cursor: pointer; }
        .btn:active { background-color: #ff6b81; }
        .fire-btn { grid-column: span 3; background-color: #2ed573; font-size: 20px; }
        .fire-btn:active { background-color: #26af5f; }
        #gameOverScreen { display: none; position: absolute; top: 0; left: 0; width: 320px; height: 350px; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; border-radius: 8px; }
        #gameOverScreen h2 { color: #ff4757; margin-bottom: 10px; }
        .restart-btn { background-color: #fff200; color: #111; border: none; font-size: 18px; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🚀 मोबाइल 2D शूटर गेम</h1>
    <div class="info">स्कोर: <span id="score">0</span></div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="320" height="350"></canvas>
        <div id="gameOverScreen">
            <h2>💥 खेल खत्म!</h2>
            <p id="finalScore" style="font-size: 18px; margin-bottom: 20px;">आपका स्कोर: 0</p>
            <button class="restart-btn" onclick="resetGame()">फिर से खेलें 🔄</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="movePlayer(-25)">◀</button>
        <button class="btn" style="visibility: hidden;"></button>
        <button class="btn" onclick="movePlayer(25)">▶</button>
        <button class="btn fire-btn" onclick="shootBullet()">🔥 FIRE (गोली चलाएं)</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let playerX = 145;
        const playerY = 310;
        const playerWidth = 30;
        const playerHeight = 30;

        let bullets = [];
        let enemies = [];
        let isGameOver = false;
        let enemyTimer;

        function startEnemySpawner() {
            enemyTimer = setInterval(() => {
                if (!isGameOver) {
                    let enemyX = Math.floor(Math.random() * (canvas.width - 25));
                    enemies.push({ x: enemyX, y: -20, size: 22, speed: 0.8 }); 
                }
            }, 2500); 
        }

        function movePlayer(dir) {
            if (isGameOver) return;
            playerX += dir;
            if (playerX < 0) playerX = 0;
            if (playerX > canvas.width - playerWidth) playerX = canvas.width - playerWidth;
        }

        function shootBullet() {
            if (isGameOver) return;
            bullets.push({ x: playerX + 11, y: playerY, width: 8, height: 15, speed: 8 });
        }

        function gameLoop() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // प्लेयर (हरा बॉक्स)
            ctx.fillStyle = "#2ed573";
            ctx.fillRect(playerX, playerY, playerWidth, playerHeight);

            // गोलियाँ चलाना
            ctx.fillStyle = "#fff200";
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].width, bullets[i].height);
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            // दुश्मन (लाल गोले)
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                
                ctx.fillStyle = "#ff4757";
                ctx.beginPath();
                ctx.arc(enemies[i].x + 11, enemies[i].y + 11, 11, 0, Math.PI * 2);
                ctx.fill();

                // कोलिशन चेक (गोली दुश्मन को लगी या नहीं)
                let enemyHit = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j].x > enemies[i].x &&
                        bullets[j].x < enemies[i].x + 22 &&
                        bullets[j].y > enemies[i].y &&
                        bullets[j].y < enemies[i].y + 22
                    ) {
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        document.getElementById("score").innerText = score;
                        enemyHit = true;
                        break; // गोली लगने पर अंदर का लूप रोकें
                    }
                }

                // अगर दुश्मन को गोली लग गई है, तो नीचे पहुँचने का चेक छोड़ दें
                if (enemyHit) continue;

                // दुश्मन नीचे पहुँचने पर ही गेम ओवर होगा
                if (enemies[i] && enemies[i].y > canvas.height) {
                    endGame();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(enemyTimer);
            document.getElementById("finalScore").innerText = "आपका स्कोर: " + score;
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function resetGame() {
            score = 0;
            playerX = 145;
            bullets = [];
            enemies = [];
            isGameOver = false;
            document.getElementById("score").innerText = score;
            document.getElementById("gameOverScreen").style.display = "none";
            clearInterval(enemyTimer);
            startEnemySpawner();
            gameLoop();
        }

        startEnemySpawner();
        gameLoop();
    </script>
</body>
</html>
