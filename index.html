<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D शूटर गेम - कमाई का मौका</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #111; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        canvas { background-color: #222; border: 3px solid #ff4757; border-radius: 8px; box-shadow: 0 0 15px rgba(255, 71, 87, 0.4); }
        .info { font-size: 20px; margin: 10px; font-weight: bold; }
        .controls { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; margin-top: 15px; }
        .btn { background-color: #ff4757; color: white; border: none; font-size: 24px; font-weight: bold; border-radius: 10px; padding: 15px 0; cursor: pointer; }
        .btn:active { background-color: #ff6b81; }
        .fire-btn { grid-column: span 3; background-color: #2ed573; font-size: 20px; }
        .fire-btn:active { background-color: #26af5f; }
    </style>
</head>
<body>

    <h1>🚀 मोबाइल 2D शूटर गेम</h1>
    <div class="info">स्कोर: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="320" height="350"></canvas>

    <!-- मोबाइल कंट्रोल बटन्स -->
    <div class="controls">
        <button class="btn" onclick="movePlayer(-20)">◀</button>
        <button class="btn" style="visibility: hidden;"></button>
        <button class="btn" onclick="movePlayer(20)">▶</button>
        <button class="btn fire-btn" onclick="shootBullet()">🔥 FIRE (गोली चलाएं)</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let playerX = 145;
        const playerY = 310;
        const playerWidth = 30;
        const playerHeight = 30;

        let bullets = [];
        let enemies = [];

        // दुश्मन बनाने के लिए टाइमर
        setInterval(() => {
            let enemyX = Math.floor(Math.random() * (canvas.width - 25));
            enemies.push({ x: enemyX, y: 0, size: 25, speed: 2 });
        }, 1200);

        function movePlayer(dir) {
            playerX += dir;
            if (playerX < 0) playerX = 0;
            if (playerX > canvas.width - playerWidth) playerX = canvas.width - playerWidth;
        }

        function shootBullet() {
            bullets.push({ x: playerX + 11, y: playerY, width: 8, height: 15, speed: 7 });
        }

        function gameLoop() {
            // स्क्रीन साफ़ करें
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // प्लेयर बनाएं (हरा बॉक्स)
            ctx.fillStyle = "#2ed573";
            ctx.fillRect(playerX, playerY, playerWidth, playerHeight);

            // गोलियाँ चलाएं
            ctx.fillStyle = "#fff200";
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].width, bullets[i].height);
                
                if (bullets[i].y < 0) bullets.splice(i, 1); // स्क्रीन से बाहर जाने पर हटाएँ
            }

            // दुश्मन बनाएं और चलाएं (लाल गोले)
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                
                ctx.fillStyle = "#ff4757";
                ctx.beginPath();
                ctx.arc(enemies[i].x + 12, enemies[i].y + 12, 12, 0, Math.PI * 2);
                ctx.fill();

                // चेक करें कि क्या गोली दुश्मन को लगी
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j].x > enemies[i].x &&
                        bullets[j].x < enemies[i].x + 25 &&
                        bullets[j].y > enemies[i].y &&
                        bullets[j].y < enemies[i].y + 25
                    ) {
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        document.getElementById("score").innerText = score;
                        break;
                    }
                }

                // अगर दुश्मन नीचे पहुँच गया तो खेल खत्म
                if (enemies[i] && enemies[i].y > canvas.height) {
                    alert("खेल खत्म! आपका कुल स्कोर: " + score);
                    enemies = [];
                    bullets = [];
                    score = 0;
                    document.getElementById("score").innerText = score;
                    playerX = 145;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
